  <style>
:root {
  color-scheme: light;
  --page: #f4f7f4;
  --ink: #152720;
  --muted: #50655c;
  --jade: #285248;
  --jade-deep: #234b3d;
  --line: #d7e2da;
  --face: "Bricolage Grotesque", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --text: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --ease: cubic-bezier(.2, .7, .25, 1);
  --gutter: clamp(20px, 5.5vw, 88px);
  --radius: 24px;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 300px;
  color: var(--ink);
  background:
    radial-gradient(ellipse at 73% 140px, #e8f1ec, transparent min(65%, 67rem)),
    var(--page);
  font: 400 15px/1.55 var(--text);
  -webkit-font-smoothing: antialiased;
}

button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { color: inherit; font: inherit; }
p, h1, h2, h3 { margin: 0; }
::selection { background: #c2e5d1; color: #18352b; }
:focus-visible { outline: 2px solid #326b59; outline-offset: 5px; }

.shell {
  width: min(1256px, calc(100% - var(--gutter) * 2));
  margin-inline: auto;
}

.glass {
  border: 1px solid rgba(91, 128, 111, .18);
  background: linear-gradient(145deg, rgba(255, 255, 255, .93), rgba(250, 253, 251, .57));
  box-shadow: inset 0 1px 0 #fff, 0 6px 20px rgba(28, 67, 51, .045);
  backdrop-filter: blur(17px) saturate(122%);
}

.skip-link {
  position: fixed;
  z-index: 10;
  inset: 12px auto auto 12px;
  padding: 10px 16px;
  border-radius: 10px;
  transform: translateY(-150%);
  background: var(--jade-deep);
  color: white;
}

.skip-link:focus { transform: translateY(0); }

.header {
  position: sticky;
  z-index: 3;
  top: 0;
  background: rgba(248, 251, 248, .86);
  border-bottom: 1px solid rgba(81, 112, 97, .14);
  backdrop-filter: blur(20px) saturate(140%);
}

.header-inner {
  min-height: 76px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
}

.brand {
  width: fit-content;
  min-width: 0;
  display: inline-flex;
  align-items: center;
  gap: 11px;
  font: 750 21px/1 var(--face);
  letter-spacing: -.045em;
}

.brand-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.brand-mark {
  position: relative;
  display: grid;
  flex: none;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 1px solid #315e4e;
  border-radius: 11px;
  color: #d9f5e6;
  background: radial-gradient(ellipse at 23% 10%, #4f806e, transparent 72%), #214638;
  box-shadow: inset 0 1px 0 #83a597, 0 3px 9px rgba(24, 66, 48, .22);
}

.snowflake i {
  position: absolute;
  width: 16px;
  height: 1.5px;
  background: currentColor;
  border-radius: 2px;
}

.snowflake i:nth-child(2) { transform: rotate(60deg); }
.snowflake i:nth-child(3) { transform: rotate(-60deg); }

.nav {
  display: flex;
  gap: 3px;
  align-items: center;
  padding: 4px;
  border-radius: 99px;
}

.nav a {
  min-width: 65px;
  padding: 7px 12px;
  border-radius: 99px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  transition: background .2s, color .2s;
}

.nav a:hover, .nav a[aria-current] {
  color: #1d4b3c;
  background: #e3efe7;
}

.header-link {
  display: inline-flex;
  justify-self: end;
  align-items: center;
  gap: 9px;
  padding: 8px 0 8px 8px;
  font-size: 14px;
  font-weight: 650;
}

.arrow {
  display: inline-block;
  font-family: "Segoe UI Symbol", var(--text);
  font-weight: 600;
  line-height: 1;
  transition: transform .25s var(--ease);
}

.header-link:hover .arrow { transform: translate(2px, -2px); }

.hero {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: .94fr 1.06fr;
  align-items: center;
  min-height: 588px;
  padding: clamp(38px, 5.2vw, 75px) 0 clamp(46px, 5vw, 70px);
}

.hero-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
  animation: entrance .7s var(--ease) both;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: clamp(19px, 2vw, 27px);
  color: var(--jade);
  font-size: 13px;
  font-weight: 720;
  letter-spacing: .09em;
}

.signal {
  width: 7px;
  height: 7px;
  flex: 0 0 7px;
  border-radius: 50%;
  background: #427d68;
  box-shadow: 0 0 0 4px #dcece1;
}

.hero h1 {
  font: 770 clamp(72px, 8.9vw, 132px)/.84 var(--face);
  letter-spacing: -.05em;
  overflow-wrap: anywhere;
}

.hero h1 span { display: block; }
.hero h1 span + span { margin-top: .085em; color: var(--jade); }

.hero-description {
  max-width: 375px;
  margin-top: clamp(25px, 2.7vw, 39px);
  color: var(--muted);
  font-size: 16px;
  line-height: 1.85;
  overflow-wrap: anywhere;
  text-wrap: balance;
}

.hero-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 28px;
}

.button {
  min-height: 49px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  padding: 10px 18px;
  border-radius: 99px;
  white-space: nowrap;
  font-size: 14px;
  font-weight: 700;
  transition: transform .24s var(--ease), box-shadow .24s, background .24s;
}

.button:hover { transform: translateY(-2px); }
.button:active { transform: translateY(0); }
.button-primary:hover .arrow { transform: translateY(2px); }
.button-secondary:hover .arrow { transform: translate(2px, -2px); }

.button-primary {
  border: 1px solid #254d3e;
  color: #fff;
  background: linear-gradient(158deg, #3a6655, var(--jade-deep) 78%);
  box-shadow: inset 0 1px 0 #739487, 0 7px 18px rgba(31, 72, 55, .23);
}

.button-primary:hover { box-shadow: inset 0 1px 0 #85aa9b, 0 10px 23px rgba(31, 72, 55, .28); }
.button-secondary:hover { background: #fff; }

.hero-art {
  position: absolute;
  inset: 13px -1.6% 16px 40%;
  overflow: hidden;
  pointer-events: none;
  animation: entrance .85s .08s var(--ease) both;
}

.hero-art canvas {
  display: block;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

.art-grid {
  position: absolute;
  inset: 2% 0;
  background-image:
    linear-gradient(to right, #6a967e2b 1px, transparent 1px),
    linear-gradient(to bottom, #6a967e2b 1px, transparent 1px);
  background-size: 45px 45px;
  background-position: center;
  mask-image: radial-gradient(ellipse at 59% 47%, #000 9%, #0005 51%, transparent 72%);
}

.art-orbit {
  position: absolute;
  left: 56%;
  top: 49%;
  width: min(75%, 476px);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border: 1px solid #83a79449;
  border-radius: 50%;
}

.art-orbit-inner {
  width: min(64%, 406px);
  border-style: dashed;
  border-color: #739d8644;
}

.art-point {
  position: absolute;
  width: 8px;
  height: 8px;
  border: 2px solid #a3c4b0;
  border-radius: 50%;
  background: #f7fdf9;
  box-shadow: 0 0 0 4px #f2fbf5a6;
}

.art-point-top { left: 73%; top: 13%; }
.art-point-bottom { left: 27%; bottom: 24%; }

.art-edge {
  position: absolute;
  width: 24px;
  height: 24px;
  color: #7598888c;
}

.art-edge-top { right: 5%; top: 9%; border-top: 1px solid; border-right: 1px solid; }
.art-edge-bottom { left: 9%; bottom: 8%; border-bottom: 1px solid; border-left: 1px solid; }

.summary {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  border-block: 1px solid var(--line);
}

.summary-item {
  display: flex;
  align-items: center;
  gap: 13px;
  min-width: 0;
  min-height: 79px;
  padding: 12px clamp(12px, 2.7vw, 34px);
}

.summary-item + .summary-item { border-left: 1px solid var(--line); }
a.summary-item { transition: background .24s; }
a.summary-item:hover { background: #e6efe8; }
.summary-item div { min-width: 0; }
.summary-label { display: block; color: var(--muted); font-size: 12px; }
.summary-item strong { display: block; font: 750 19px/1.1 var(--face); overflow-wrap: anywhere; }
.summary-unit { font: 600 11px var(--text); }
.summary-arrow { margin-left: auto; color: var(--jade); }
a.summary-item:hover .summary-arrow { transform: translateY(3px); }

.summary-icon, .community-card-icon {
  position: relative;
  display: grid;
  place-items: center;
  flex: 0 0 38px;
  width: 38px;
  height: 38px;
  border: 1px solid #d0e1d5;
  border-radius: 12px;
  color: #305d4e;
  background: linear-gradient(145deg, #f5fbf7, #e4f0e8);
}

.icon-roblox::before {
  content: "";
  width: 14px;
  height: 14px;
  border: 4.5px solid currentColor;
  transform: rotate(15deg);
}

.icon-servers i {
  position: absolute;
  width: 16px;
  height: 6px;
  border: 1.3px solid currentColor;
  border-radius: 2px;
  transform: translateY(-4px);
}

.icon-servers i + i { transform: translateY(4px); }

.icon-community::before {
  content: "";
  width: 16px;
  height: 12px;
  border: 1.35px solid currentColor;
  border-radius: 5px;
  transform: translateY(-1px);
}

.icon-community::after {
  content: "";
  position: absolute;
  width: 4px;
  height: 4px;
  border-left: 1.35px solid currentColor;
  border-bottom: 1.35px solid currentColor;
  transform: translate(-4px, 6px) skewY(-30deg);
}

.details {
  display: grid;
  grid-template-columns: minmax(0, 1.85fr) minmax(0, 1fr);
  align-items: start;
  gap: clamp(26px, 4vw, 58px);
  padding-block: clamp(52px, 6vw, 89px);
}

.details section { scroll-margin-top: 100px; }
.details section.arrived { animation: entrance .6s var(--ease) both; }

.details h2 {
  margin-bottom: 18px;
  font: 760 clamp(26px, 3vw, 39px)/1.22 var(--face);
  letter-spacing: -.035em;
}

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
}

.filter-bar button {
  min-height: 36px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px;
  border: 1px solid var(--line);
  border-radius: 99px;
  background: #f8fbf8;
  color: var(--muted);
  font-size: 13px;
  font-weight: 650;
  cursor: pointer;
  transition: color .2s, background .2s, border-color .2s;
}

.filter-bar button:hover { border-color: #82ab95; color: var(--jade); }
.filter-bar button[aria-pressed="true"] { border-color: #b5cdbc; background: #e3efe6; color: #224f3f; }

.server-empty, .server-card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 18px;
  border-radius: 17px;
}

.server-empty { min-height: 109px; }
.empty-title, .server-card-name { font-size: 15px; font-weight: 740; }
.empty-description, .server-card-detail { margin-top: 4px; color: var(--muted); font-size: 13px; }
.server-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.server-card { justify-content: space-between; }
.server-card-body { min-width: 0; overflow-wrap: anywhere; }
.server-card-actions { display: flex; flex: none; align-items: center; gap: 9px; }

.server-status {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #304c40;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 690;
}

.server-status::after, .filter-bar [class^="status-"]::after {
  content: "";
  width: 11px;
  height: 11px;
  border: 1px solid var(--dot-outline);
  border-radius: 50%;
  background: radial-gradient(circle at 33% 27%, #fff9, transparent 44%), var(--dot);
  box-shadow: 0 0 0 3px var(--dot-ring);
}

.filter-bar [class^="status-"]::after { width: 7px; height: 7px; box-shadow: none; }

.status-supported { --dot: #38a96d; --dot-outline: #288652; --dot-ring: #dbf0e1; }
.status-testing { --dot: #e8af30; --dot-outline: #a97312; --dot-ring: #fbefd0; }
.status-planned { --dot: #df666c; --dot-outline: #b84b51; --dot-ring: #f9e0e2; }

.server-card-link {
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: #eaf3ed;
  color: var(--jade);
}

.server-card-link:hover { transform: translate(2px, -2px); }

.community-card {
  position: relative;
  isolation: isolate;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  overflow: hidden;
  padding: 20px;
  border-radius: var(--radius);
  background:
    radial-gradient(ellipse at 94% 18%, #d5ebde, transparent 62%),
    linear-gradient(135deg, #fff, #eaf4ed);
  transition: transform .27s var(--ease), box-shadow .27s;
}

.community-card::after {
  position: absolute;
  z-index: -1;
  content: "";
  width: 190px;
  height: 190px;
  top: -71px;
  right: -40px;
  border: 1px solid #fff9;
  border-radius: 48% 52% 55% 45%;
  transform: rotate(-24deg);
  background: linear-gradient(140deg, #fff8, transparent);
  box-shadow: inset 2px 3px 3px #fff9, 0 0 29px #678f7a13;
}

.community-card:hover {
  transform: translateY(-3px);
  box-shadow: inset 0 1px 0 #fff, 0 12px 30px #234b3d17;
}

.community-card:hover .arrow { transform: translate(2px, -2px); }
.community-card-icon { margin-bottom: 7px; }
.community-card-name { font: 770 23px/1.05 var(--face); overflow-wrap: anywhere; }
.community-card-description { color: var(--muted); font-size: 13px; }

.community-card-cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 7px 12px;
  border: 1px solid #c6ddd0;
  border-radius: 99px;
  color: #204f3e;
  background: #ffffffb3;
  font-size: 12px;
  font-weight: 700;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  min-height: 77px;
  border-top: 1px solid var(--line);
}

.brand-footer { font-size: 16px; color: #3b574c; }
.brand-footer .brand-mark { width: 25px; height: 25px; border-radius: 8px; }
.brand-footer .snowflake i { width: 12px; }

@keyframes entrance {
  from { opacity: .25; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

  <script>
"use strict";

const statuses = {
  supported: "已支持",
  testing: "待验证",
  planned: "暂不支持",
};

const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));
const results = document.querySelector("#server-results");
const supportCount = document.querySelector("#support-count");
const serverIcon = results.querySelector(".summary-icon");
let servers = [];
let filter = "all";
let loadState = "loading";

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  element.className = className;
  if (text) element.textContent = text;
  return element;
}

function safeUrl(value) {
  if (typeof value !== "string" || !value.trim()) return "";

  try {
    const url = new URL(value);
    return url.protocol === "https:" && !url.username && !url.password ? url.href : "";
  } catch {
    return "";
  }
}

function emptyState(title, description) {
  const panel = makeElement("div", "server-empty glass");
  const copy = makeElement("div", "empty-copy");
  copy.append(
    makeElement("p", "empty-title", title),
    makeElement("p", "empty-description", description),
  );
  panel.append(serverIcon.cloneNode(true), copy);
  return panel;
}

function serverCard(server) {
  const row = makeElement("li", "server-card glass");
  const body = makeElement("div", "server-card-body");
  body.append(makeElement("h3", "server-card-name", server.name));
  if (server.detail) body.append(makeElement("p", "server-card-detail", server.detail));

  const status = makeElement("span", `server-status status-${server.status}`, statuses[server.status]);
  const actions = makeElement("div", "server-card-actions");
  if (server.url) {
    const link = makeElement("a", "server-card-link arrow", "↗");
    link.href = server.url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", `打开 ${server.name}`);
    actions.append(link);
  }
  actions.append(status);

  row.append(body, actions);
  return row;
}

function renderServers() {
  if (loadState === "loading") return;

  const visible = filter === "all" ? servers : servers.filter((server) => server.status === filter);
  let view;

  if (loadState === "failed") {
    view = emptyState("暂时无法读取支持列表", "请刷新页面重试，或前往 KOOK 社区查询。");
  } else if (!servers.length) {
    view = emptyState("暂无已公开的服务器", "支持列表将在有服务器可用时更新。");
  } else if (!visible.length) {
    view = emptyState("该状态暂无服务器记录", "可以切换状态查看其他服务器。");
  } else {
    view = makeElement("ul", "server-list");
    visible.forEach((server) => view.append(serverCard(server)));
  }

  results.replaceChildren(view);
  results.setAttribute("aria-busy", "false");
}

function applyServers(content) {
  if (!content || typeof content !== "object" || !Array.isArray(content.servers)) {
    throw new Error("Invalid site content");
  }

  servers = content.servers
    .filter((server) => server && typeof server.name === "string" && server.name.trim() && Object.hasOwn(statuses, server.status))
    .map((server) => ({
      name: server.name.trim(),
      detail: typeof server.detail === "string" ? server.detail.trim() : "",
      status: server.status,
      url: safeUrl(server.url),
    }));

  supportCount.textContent = servers.filter((server) => server.status === "supported").length.toLocaleString("zh-CN");
  loadState = "loaded";
}

function loadContent() {
  try {
    const source = document.querySelector("#server-data");
    applyServers(JSON.parse(source.textContent));
  } catch {
    loadState = "failed";
  }
  renderServers();
}

function highlightNav() {
  const current = ["#servers", "#community"].includes(location.hash) ? location.hash : "#top";
  document.querySelectorAll(".nav a").forEach((link) => {
    if (link.hash === current) link.setAttribute("aria-current", "location");
    else link.removeAttribute("aria-current");
  });
}

filterButtons.forEach((button) => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    filterButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
    renderServers();
  });
});

if (!location.hash && "IntersectionObserver" in window) {
  // There is no layout dependency on the scroll transition or its observer.
  const observer = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      entry.target.classList.add("arrived");
      observer.unobserve(entry.target);
    }
  }, { threshold: 0.18 });
  document.querySelectorAll(".details > section").forEach((section) => observer.observe(section));
}

window.addEventListener("hashchange", highlightNav);
highlightNav();
loadContent();
  </script>
  <script>
(() => {
  const canvas = document.getElementById('crystal');
  const context = canvas?.getContext('2d');
  if (!context) return;

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)');
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const mix = (a, b, ratio) => a + (b - a) * ratio;

  function randomFrom(seed) {
    return () => {
      seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }

  const random = randomFrom(25769);
  const steps = [-0.94, -0.75, -0.53, -0.28, -0.03, 0.22, 0.47, 0.70, 0.91];
  const ringPoints = [
    ...steps.map((point) => [point, -1]),
    ...steps.map((point) => [1, point]),
    ...steps.map((point) => [-point, 1]),
    ...steps.map((point) => [-1, -point]),
  ];

  // The front is built in separate bevels so the facets can catch different reflections.
  const sections = [
    [1.17, -0.45, 0.070], [1.37, -0.23, 0.150], [1.30, 0.15, 0.135],
    [1.15, 0.34, 0.088], [0.91, 0.45, 0.090], [0.64, 0.36, 0.047],
    [0.51, 0.23, 0.028], [0.49, -0.31, 0.030], [0.60, -0.46, 0.033],
  ];
  const vertices = sections.map(([size, depth, roughness]) => ringPoints.map(([x, y]) => {
    const jitter = () => (random() - 0.5) * roughness * 2;
    return [x * size + jitter(), y * size + jitter(), depth + jitter()];
  }));

  const facets = sections.flatMap((_, ring) => ringPoints.flatMap((__, index) => {
    const nextRing = (ring + 1) % sections.length;
    const next = (index + 1) % ringPoints.length;
    const corners = [[ring, index], [ring, next], [nextRing, next], [nextRing, index]];
    const diagonals = random() > 0.5 ? [[0, 1, 2], [0, 2, 3]] : [[0, 1, 3], [1, 2, 3]];
    return diagonals.map((triangle) => ({
      ring,
      grain: random(),
      shine: random(),
      seed: Math.floor(random() * 4294967296),
      vertices: triangle.map((corner) => corners[corner]),
    }));
  }));

  const fragments = [
    [-1.46, 0.97, -0.22, 0.19, -0.7], [-1.65, 0.59, 0.10, 0.10, 0.7],
    [-1.45, -1.00, 0.12, 0.17, -0.4], [-1.10, -1.43, -0.16, 0.22, 0.2],
    [-0.55, -1.61, 0.02, 0.10, 0.6], [0.92, -1.54, -0.02, 0.10, -0.4],
    [1.21, -1.37, 0.11, 0.21, 0.9], [1.56, -0.68, 0.17, 0.20, -0.6],
    [1.75, -0.40, -0.12, 0.10, 0.7], [1.59, 0.71, 0.29, 0.18, -0.4],
    [1.34, 1.28, -0.11, 0.20, 0.7], [0.78, 1.43, 0.12, 0.19, 0.5],
    [-0.42, 1.55, -0.18, 0.14, 0.1], [-0.88, 1.40, 0.09, 0.19, 0.4],
    [0.20, 1.64, 0.07, 0.07, -0.7], [-1.72, -0.13, -0.22, 0.08, -0.5],
  ];

  const dust = Array.from({ length: 127 }, () => {
    const angle = random() * Math.PI * 2;
    const radius = 1.19 + random() ** 0.72 * 0.79;
    return [Math.cos(angle) * radius, Math.sin(angle) * radius, random(), random()];
  });

  function drawDust() {
    for (const [x, y, size, light] of dust) {
      context.fillStyle = `rgba(${light > 0.78 ? '102,158,86' : '78,139,118'},${0.07 + light * 0.21})`;
      context.fillRect(x, y, 0.003 + size * 0.007, 0.003 + size * 0.007);
    }
  }

  function polygon(points) {
    context.beginPath();
    context.moveTo(points[0][0], points[0][1]);
    for (const [x, y] of points.slice(1)) context.lineTo(x, y);
    context.closePath();
  }

  function rgb(intensity, warm, opacity = 1) {
    const red = 21 + intensity * (warm ? 226 : 219);
    const green = 46 + intensity * 209;
    const blue = 40 + intensity * (warm ? 166 : 210);
    return `rgba(${red},${green},${blue},${opacity})`;
  }

  function drawFragment([x, y, z, size, angle], view) {
    const [centerX, centerY] = view([x, y, z]);
    const [sin, cos] = [Math.sin(angle), Math.cos(angle)];
    const points = [[-0.58, 0.30], [-0.22, -0.24], [0.96, -0.42], [0.40, 0.26], [0.17, -0.07]]
      .map(([u, v]) => [centerX + (u * cos - v * sin) * size, centerY + (u * sin + v * cos) * size]);
    const tones = [0.75, 0.47, 0.63, 0.28];

    for (let index = 0; index < 4; index += 1) {
      const [start, end] = [points[index], points[(index + 1) % 4]];
      polygon([start, end, points[4]]);
      const tint = context.createLinearGradient(...start, ...points[4]);
      tint.addColorStop(0, rgb(tones[index], index === 1, 0.86));
      tint.addColorStop(1, rgb(tones[index] * 0.64, false, 0.63));
      context.fillStyle = tint;
      context.fill();
      context.strokeStyle = rgb(0.71, index === 2, index === 1 ? 0.54 : 0.19);
      context.lineWidth = 0.0045;
      context.stroke();
    }
  }

  function fracture(pointA, pointB, pointC, roll, light) {
    const start = [mix(pointA[0], pointB[0], roll()), mix(pointA[1], pointB[1], roll())];
    const center = [(pointA[0] + pointB[0] + pointC[0]) / 3, (pointA[1] + pointB[1] + pointC[1]) / 3];
    const length = 0.40 + roll() * 0.53;
    let x = start[0];
    let y = start[1];

    context.beginPath();
    context.moveTo(x, y);
    for (let index = 0; index < 5; index += 1) {
      const progress = (index + 1) * length / 5;
      x = mix(start[0], center[0], progress) + (roll() - 0.5) * 0.023;
      y = mix(start[1], center[1], progress) + (roll() - 0.5) * 0.023;
      context.lineTo(x, y);
    }
    context.lineWidth = 0.0025 + roll() * 0.0038;
    context.strokeStyle = rgb(0.77, roll() > 0.88, light);
    context.stroke();
  }

  function drawFacet({ points, ring, grain, shine, seed, normal }) {
    const [pointA, pointB, pointC] = points;
    const [nx, ny, nz] = normal;
    const rim = (1 - nz) ** 2;
    const lamp = clamp(nx * -0.29 + ny * 0.55 + nz * 0.72, 0, 1);
    const reflection = Math.exp(-((nx - 0.31) ** 2 * 2 + (ny - 0.76) ** 2 * 8)) * 0.53;
    const brightReflection = clamp(nx * -0.70 + ny * 0.21 + nz * 0.68, 0, 1) ** 17 * 0.35;
    const warm = shine > 0.86 || (ring === 5 && nx > 0.4);
    const outer = ring === 1 || ring === 2;
    const tint = clamp(0.29 + 0.112 * grain + 0.30 * lamp ** 5 + 0.11 * rim + reflection, 0, 0.87);
    const start = points.reduce((top, point) => point[1] < top[1] ? point : top);
    const end = points.reduce((bottom, point) => point[1] > bottom[1] ? point : bottom);
    const fill = context.createLinearGradient(start[0], start[1], end[0] + 0.0001, end[1]);

    fill.addColorStop(0, rgb(clamp(tint + 0.21 * shine + brightReflection, 0, 1), warm));
    fill.addColorStop(0.12, rgb(clamp(tint + 0.09 * shine + brightReflection * 0.47, 0, 1), warm));
    fill.addColorStop(0.31 + grain * 0.33, rgb(tint * (outer ? 0.64 : 0.75), warm, 0.77 + grain * 0.14));
    fill.addColorStop(1, rgb(clamp(tint * (0.61 + shine * 0.30), 0, 1), false, 0.83 + grain * 0.14));
    polygon(points);
    context.fillStyle = fill;
    context.lineWidth = 0.0023;
    context.strokeStyle = fill;
    context.stroke();
    context.fill();

    const area = Math.abs((pointB[0] - pointA[0]) * (pointC[1] - pointA[1]) - (pointC[0] - pointA[0]) * (pointB[1] - pointA[1]));
    if (area > 0.011 && grain > 0.24) {
      const roll = randomFrom(seed);
      context.save();
      context.clip();
      const band = context.createLinearGradient(pointA[0], pointA[1], pointC[0], pointC[1]);
      const bright = 0.03 + reflection * 0.35 + shine * 0.11;
      band.addColorStop(0, rgb(0.54, warm, 0));
      band.addColorStop(0.37, rgb(0.69, warm, bright));
      band.addColorStop(0.41, rgb(0.40, warm, 0.011));
      band.addColorStop(0.67, rgb(0.84, warm, bright * 0.73));
      band.addColorStop(1, rgb(0.68, warm, 0));
      context.fillStyle = band;
      context.fill();

      fracture(pointA, pointB, pointC, roll, 0.09 + shine * 0.23);
      if (grain > 0.72) fracture(pointB, pointC, pointA, roll, 0.16);
      if (grain > 0.84) fracture(pointC, pointA, pointB, roll, 0.27);
      context.restore();
    }

    for (let edge = 0; edge < 3; edge += 1) {
      const from = points[edge];
      const to = points[(edge + 1) % 3];
      const length = Math.hypot(to[0] - from[0], to[1] - from[1]);
      if (length < 0.042) continue;

      const catchesLight = edge === 0 && (ring < 4 || ring === 5 || ring === 6);
      const strength = catchesLight
        ? 0.15 + 0.47 * shine ** 3 + 0.17 * rim + brightReflection * 0.31
        : 0.025 + 0.23 * shine ** 3 + 0.17 * reflection;
      const glint = context.createLinearGradient(from[0], from[1], to[0], to[1]);
      glint.addColorStop(0, rgb(0.84, warm, strength * 0.37));
      glint.addColorStop(0.20 + grain * 0.55, rgb(0.98, warm, strength));
      glint.addColorStop(1, rgb(0.72, warm, strength * 0.12));
      context.beginPath();
      context.moveTo(from[0], from[1]);
      context.lineTo(to[0], to[1]);
      context.lineWidth = 0.0021 + 0.0055 * shine ** 4;
      context.strokeStyle = glint;
      context.stroke();
    }
  }

  function drawSpark([x, y], size, warmth) {
    const halo = context.createRadialGradient(x, y, 0, x, y, size * 1.8);
    halo.addColorStop(0, rgb(0.90, warmth, 0.32));
    halo.addColorStop(0.11, rgb(0.83, warmth, 0.16));
    halo.addColorStop(1, rgb(0.65, warmth, 0));
    context.fillStyle = halo;
    context.fillRect(x - size * 1.8, y - size * 1.8, size * 3.6, size * 3.6);

    const light = context.createLinearGradient(x - size, y, x + size, y);
    light.addColorStop(0, rgb(0.99, warmth, 0));
    light.addColorStop(0.50, rgb(0.99, warmth, 0.81));
    light.addColorStop(1, rgb(0.99, warmth, 0));
    context.fillStyle = light;
    context.fillRect(x - size, y - 0.0017, size * 2, 0.0034);
    context.fillStyle = rgb(1, warmth, 0.73);
    context.fillRect(x - 0.0022, y - 0.004, 0.0044, 0.008);
  }

  function createView(tiltX, tiltY) {
    const xAngle = 0.34 + tiltY * 0.26;
    const yAngle = -0.42 + tiltX * 0.32;
    const zAngle = -0.31 + tiltX * 0.035;
    const [sx, sy, sz] = [Math.sin(xAngle), Math.sin(yAngle), Math.sin(zAngle)];
    const [cx, cy, cz] = [Math.cos(xAngle), Math.cos(yAngle), Math.cos(zAngle)];

    return ([x, y, z]) => {
      const rotatedY = y * cx - z * sx;
      const alongDepth = y * sx + z * cx;
      const rotatedX = x * cy + alongDepth * sy;
      const depth = -x * sy + alongDepth * cy;
      const perspective = 4.8 / (4.8 - depth);
      return [
        (rotatedX * cz - rotatedY * sz) * perspective,
        -(rotatedX * sz + rotatedY * cz) * perspective,
        depth,
      ];
    };
  }

  let targetX = 0;
  let targetY = 0;
  let currentX = 0;
  let currentY = 0;
  let nextFrame = 0;

  function draw() {
    nextFrame = 0;
    if (!canvas.width || !canvas.height) return;

    currentX = mix(currentX, targetX, 0.19);
    currentY = mix(currentY, targetY, 0.19);
    const scale = Math.min(canvas.width, canvas.height) / 4.2;
    const view = createView(currentX, currentY);
    const projected = vertices.map((ring) => ring.map(view));

    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.setTransform(scale, 0, 0, scale, canvas.width * 0.50, canvas.height * 0.50);
    drawDust();
    for (const fragment of fragments) drawFragment(fragment, view);

    const visibleFacets = [];
    for (const facet of facets) {
      const points = facet.vertices.map(([ring, index]) => projected[ring][index]);
      const [[ax, ay, az], [bx, by, bz], [cx, cy, cz]] = points;
      const nz = (by - ay) * (cx - ax) - (bx - ax) * (cy - ay);
      if (nz <= 0) continue;

      const nx = (bz - az) * (cy - ay) - (by - ay) * (cz - az);
      const ny = (bz - az) * (cx - ax) - (bx - ax) * (cz - az);
      const magnitude = Math.hypot(nx, ny, nz);
      visibleFacets.push({
        ...facet,
        points,
        normal: [nx / magnitude, ny / magnitude, nz / magnitude],
        depth: (az + bz + cz) / 3,
      });
    }

    visibleFacets.sort((first, second) => first.depth - second.depth);
    for (const facet of visibleFacets) drawFacet(facet);
    drawSpark(projected[2][24], 0.10, false);
    drawSpark(projected[3][12], 0.073, true);
    drawSpark(projected[5][19], 0.065, false);
    canvas.classList.add('is-rendered');

    if (Math.abs(currentX - targetX) + Math.abs(currentY - targetY) > 0.001) schedule();
  }

  function schedule() {
    if (!nextFrame) nextFrame = requestAnimationFrame(draw);
  }

  function resize() {
    const bounds = canvas.getBoundingClientRect();
    const density = Math.min(devicePixelRatio || 1, 1.75);
    canvas.width = Math.round(bounds.width * density);
    canvas.height = Math.round(bounds.height * density);
    schedule();
  }

  function resetTilt() {
    targetX = 0;
    targetY = 0;
    if (reducedMotion.matches) [currentX, currentY] = [0, 0];
    schedule();
  }

  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas);
  else window.addEventListener('resize', resize);

  const hoverArea = canvas.closest('.hero') ?? canvas.parentElement;
  hoverArea?.addEventListener('pointermove', ({ clientX, clientY, pointerType }) => {
    if (reducedMotion.matches || !finePointer.matches || pointerType !== 'mouse') return;
    const { left, top, width, height } = canvas.getBoundingClientRect();
    if (!width || !height) return;
    targetX = clamp((clientX - left) / width - 0.5, -0.50, 0.50);
    targetY = clamp((clientY - top) / height - 0.5, -0.50, 0.50);
    schedule();
  }, { passive: true });
  hoverArea?.addEventListener('pointerleave', resetTilt);
  reducedMotion.addEventListener('change', resetTilt);
  resize();
})();
  </script>
</body>
</html>
